[package]
name = 'fasttube'
version = '0.4.0'
edition = '2024'
rust-version = '1.98'
description = 'A native, local-first Windows desktop client for browsing and watching YouTube.'
license = 'MIT OR Apache-2.0'
repository = 'https://github.com/nathanbzrr/FastTube'
homepage = 'https://github.com/nathanbzrr/FastTube'
readme = 'README.md'
keywords = ['youtube', 'desktop', 'egui', 'mpv', 'windows']
categories = ['gui', 'multimedia::video']

[dependencies]
eframe = { version = '=0.36.2', default-features = false, features = ['default_fonts', 'glow'] }
egui_extras = { version = '=0.36.2', features = ['http', 'image', 'svg'] }
fastframe-autostart = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-fonts = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-graphics = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-icons = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-instance = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-now-playing = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-power = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-scroll = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-text = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
fastframe-tray = { git = 'https://github.com/crmne/fastframe.git', tag = 'v0.17.0' }
image = { version = '0.25', default-features = false, features = ['jpeg', 'png', 'webp'] }
libloading = '0.8'
raw-window-handle = '0.6'
serde_json = '1'
serde = { version = '1', features = ['derive'] }
zeroize = '1'
base64 = '0.22'
getrandom = '0.3'
sha2 = '0.10'
url = '2'
reqwest = { version = '0.12', default-features = false, features = ['blocking', 'json', 'rustls-tls', 'gzip', 'brotli', 'http2'] }
tungstenite = '0.29'
windows-sys = { version = '0.61', features = ['Win32_Foundation', 'Win32_Security_Cryptography', 'Win32_Storage_FileSystem', 'Win32_System_DataExchange', 'Win32_System_Memory', 'Win32_System_Ole', 'Win32_UI_WindowsAndMessaging'] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
